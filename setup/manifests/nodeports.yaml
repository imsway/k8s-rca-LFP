# Standalone NodePort Services for the observability backends bundled inside
# the opentelemetry-demo chart (Prometheus, Grafana, Jaeger).
#
# These are plain passthrough Services -- not Helm-values overrides -- on
# purpose: the three backends are separate dependency subcharts
# (prometheus-community/prometheus, grafana/grafana, jaegertracing/jaeger)
# each with its own NodePort-override schema that varies by chart version.
# Rather than gamble on each subchart's exact values.yaml keys, we just point
# a new Service at the same pod selector the subchart's own ClusterIP Service
# uses. Selectors below were confirmed by rendering the actual chart
# (opentelemetry-demo 0.41.1) with `helm template`, not guessed.
apiVersion: v1
kind: Service
metadata:
  name: prometheus-nodeport
  namespace: otel-demo
spec:
  type: NodePort
  selector:
    app.kubernetes.io/name: prometheus
    app.kubernetes.io/component: server
    app.kubernetes.io/instance: otel-demo
  ports:
    - port: 9090
      targetPort: 9090
      nodePort: 30090
---
apiVersion: v1
kind: Service
metadata:
  name: grafana-nodeport
  namespace: otel-demo
spec:
  type: NodePort
  selector:
    app.kubernetes.io/name: grafana
    app.kubernetes.io/instance: otel-demo
  ports:
    - port: 80
      targetPort: 3000
      nodePort: 30080
---
apiVersion: v1
kind: Service
metadata:
  name: jaeger-nodeport
  namespace: otel-demo
spec:
  type: NodePort
  selector:
    app.kubernetes.io/name: jaeger
    app.kubernetes.io/instance: otel-demo
    app.kubernetes.io/component: all-in-one
  ports:
    - port: 16686
      targetPort: 16686
      nodePort: 30686
---
# Loki is our own separate Helm release (not a dependency subchart of
# otel-demo), selector confirmed via `helm template` of grafana/loki 7.3.0
# in SingleBinary mode.
apiVersion: v1
kind: Service
metadata:
  name: loki-nodeport
  namespace: otel-demo
spec:
  type: NodePort
  selector:
    app.kubernetes.io/name: loki
    app.kubernetes.io/instance: loki
    app.kubernetes.io/component: single-binary
  ports:
    - port: 3100
      targetPort: 3100
      nodePort: 30100
