[project]
name = "k8s-rca-agent"
version = "0.1.0"
description = "AI agent for Kubernetes root-cause analysis"
requires-python = ">=3.11"
dependencies = [
    "langgraph>=0.4",
    "langchain-core>=0.3",
    "langchain-google-genai>=2.0",
    "langchain-groq>=0.3",
    "kubernetes>=31.0",
    "requests>=2.32",
    "pydantic>=2.9",
    "rich>=13.9",
    "click>=8.1",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-mock>=3.14",
]
eval = [
    "tabulate>=0.9",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["src*", "scenarios*", "eval*"]
